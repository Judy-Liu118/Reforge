name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # The runner image ships Docker Client + Server, but its docs make no
      # promise about the daemon being up. Print the versions so that fact is
      # evidence in the log rather than an assumption, and so a dead daemon
      # fails here instead of quietly turning the docker tests into skips.
      - name: Show docker version
        run: docker version

      - name: Run pytest
        env:
          # LLMClient passes config.llm_api_key explicitly to OpenAI(); on CI
          # without a .env file that value is "" which the OpenAI SDK rejects
          # at construction time (won't fall back to env vars when an empty
          # string is passed). Set LLM_API_KEY alongside OPENAI_API_KEY so
          # both code paths get a dummy value sufficient for non-network
          # construction in tests that build a real LLMClient.
          LLM_API_KEY: "dummy-for-unit-tests"
          OPENAI_API_KEY: "dummy-for-unit-tests"
        run: |
          # pipefail matters here: without it `tee` returns 0 and a failing
          # pytest would pass the step silently.
          set -o pipefail
          pytest reforge/tests -rs | tee pytest-out.txt

      # Lift the counts and the skip list onto the run page. Be clear about what
      # this buys and what it does not: the docker step below is confirmable
      # WITHOUT reading any log, because a deviation makes it FAIL — the sentinel
      # turns a missing daemon into a red step. That is a guarantee. This summary
      # is only readability. It exists because job-summary markdown is not
      # retrievable through the REST API either (no endpoint returns it), so it
      # serves a human opening the run page and nothing else. Do not let a number
      # being visible here be mistaken for that number being checked.
      #
      # The closing grep is the one guarantee this step can offer. The chain is:
      #   (1) pytest emits a summary line  (2) tee writes it  (3) we extract it
      #   ------------------------------------------------------------ bedrock
      #   (4) append to $GITHUB_STEP_SUMMARY  (5) the platform reads it
      #   (6) it renders  (7) a human sees it
      # Nothing inside a job can observe past (4): the runner sees its own
      # filesystem and no further, and no REST endpoint returns the rendered
      # summary. So (1)-(3) is the whole of what a failing assertion can defend,
      # and that is where the grep sits.
      #
      # That is also the right half to spend it on, because the two halves differ
      # in churn: (1)-(3) depend on the pytest version, our flags and our
      # extraction, and break whenever any of those move; (5)-(6) are platform
      # behaviour and stay put once confirmed. When a guarantee cannot span the
      # whole chain, put it on the volatile half and confirm the stable half by
      # hand, once.
      #
      # Deliberately NOT asserting that $GITHUB_STEP_SUMMARY ends up non-empty:
      # the echoes below write content whether or not grep and tail found
      # anything, so that check would pass unconditionally. It would read as
      # verification while verifying nothing — please do not "fix" its absence.
      #
      # Cost to expect: if pytest dies during startup there is no summary line to
      # extract, and this step goes red next to the pytest step. Two red steps,
      # one fault — that is the design, not a fault in this step.
      - name: Publish test counts to the run summary
        if: always()
        run: |
          last=$(tail -n 1 pytest-out.txt)
          {
            echo "### pytest — Python ${{ matrix.python-version }}"
            echo ""
            echo '```'
            grep -E "^(SKIPPED|ERROR)" pytest-out.txt || echo "(no skips reported)"
            echo "$last"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -qE '[0-9]+ (passed|failed|error)' <<< "$last"

      # Run the docker-marked tests again on their own. The quiet main run
      # cannot tell "3 passed" from "3 skipped" at a glance, and a fully
      # skipped selection still exits 0 — so the guarantee is asserted here,
      # verbosely, where PASSED/SKIPPED is printed per test. REFORGE_REQUIRE_DOCKER
      # additionally arms test_docker_is_available_where_required, which turns a
      # missing daemon into a failure instead of a silent empty run.
      - name: Docker integration tests (explicit)
        env:
          REFORGE_REQUIRE_DOCKER: "1"
        run: |
          pytest reforge/tests -m docker -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check reforge --output-format=github
