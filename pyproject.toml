[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reforge"
version = "0.1.0"
description = "Self-healing Python execution runtime with governance-first design and MCP-native skill abstraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reforge Project" }]
keywords = [
    "agent",
    "runtime",
    "llm",
    "langgraph",
    "mcp",
    "skill",
    "self-healing",
    "event-sourced",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph>=1.2.5",
    "openai>=2.42.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "pandas>=3.0.3",
]

[project.optional-dependencies]
# Pillow and playwright are OPTIONAL at runtime and stay out of `dependencies`:
# `_maybe_downscale` passes images through unchanged when PIL is absent, and
# `default_skill_registry` simply does not register web_screenshot when
# playwright is missing. But the tests that cover those two branches need the
# packages present — without them the tests skip, and a skip reads as green.
# See docs/KNOWN_LIMITATIONS.md L15.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    # Image.LANCZOS is what image_compare uses; kept as an alias in 10.x
    # (it was ANTIALIAS that 10.0 removed).
    "Pillow>=10.0",
    # Only the importable package is needed — `_playwright_available()` calls
    # `importlib.util.find_spec`, so no `playwright install <browser>` step.
    "playwright>=1.40",
]
# dev REFERENCES test (PEP 508 self-referencing extra) rather than repeating it,
# so "what it takes to run the tests" has exactly one definition. The previous
# form listed pytest twice by hand, and that duplication is precisely what let
# `test` gain Pillow/playwright while `dev` silently did not — installing
# `.[dev]` would then skip the very tests `.[test]` runs. A copy is a drift
# source; only add things here that dev needs and test genuinely does not.
dev = [
    "reforge[test]",
    "ruff>=0.4",
]

[project.scripts]
reforge = "reforge.cli.main:main"
reforge-eda = "reforge.runtime.eda.__main__:main"
reforge-sql = "reforge.runtime.sql.__main__:main"
reforge-hpo = "reforge.runtime.hpo.__main__:main"
reforge-benchmark = "reforge.benchmark.__main__:main"

[project.urls]
Documentation = "https://github.com/Judy-Liu118/Reforge#readme"
Source = "https://github.com/Judy-Liu118/Reforge"

[tool.setuptools.packages.find]
include = ["reforge*"]
exclude = ["reforge.tests*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["reforge/tests"]
python_files = ["test_*.py"]
# -rs: always print WHY tests were skipped. Without it a skip is invisible in
# quiet mode, so a suite that silently stopped exercising something still reads
# as green — the same blind spot that hid the docker tests' status in CI.
addopts = ["-q", "-rs", "--strict-markers"]
markers = [
    "docker: marks tests that require a working docker daemon (skipped otherwise)",
]

[tool.ruff]
# line-length is NOT enforced by the lint gate. E501 belongs to the E5 group and
# lint.select below picks only E4/E7/E9/F, so no run of `ruff check` ever reports
# a long line — and CI runs `ruff check`, never `ruff format`. This value
# therefore only takes effect if someone runs the formatter by hand locally.
# Worth stating because the mismatch already misled once: a reviewer checked line
# lengths by hand "in place of ruff" and so verified the one thing ruff does not
# look at, while never checking the E4/E7/F rules it does.
#
# Turning it on is a two-step job, not an incidental edit — clean first, then
# enable, in separate commits. As of 2026-08-04 the tree carries 166 E501
# violations across 60+ files, many of them long strings, URLs and table rows
# where mechanical wrapping costs more readability than it buys.
#
# Trigger to reconsider: newly written code starts running past 100 columns. It
# does not today — the four files rewritten in the sandbox-hardening batch had 0
# violations against those 166, so the habit holds without a rule enforcing it.
# When that stops being true, the rule starts earning its cleanup cost.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than inherited. Ruff's *default* rule set is not
# a stable contract: 0.16.0 widened it, which turned a green CI red across 186
# files without a single repo commit in between (I001, UP*, BLE001, RUF*...).
# Pinning the tool version would only postpone that; naming the rules makes the
# lint gate depend on our decision instead of the tool's default. These four
# were ruff's default through 0.15.x — the set this codebase was written under.
# Widening it is a deliberate, separate change, not something a release does.
select = ["E4", "E7", "E9", "F"]
